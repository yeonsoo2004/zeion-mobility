<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEION</title>
    <script src="https://kit.fontawesome.com/b9593720fc.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- normalize.css -->
    <link rel="stylesheet" href="assets/css/normalize.css">
    <!-- common.css -->
    <link rel="stylesheet" href="assets/css/common.css" />
    <!-- main page -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <header class="site-header" role="banner">
        <div class="inner site-header__inner">
            <a href="./index.html" class="site-header__brand" aria-label="ZEION 홈">
                <img src="assets/images/logo.png" class="site-header__logo-img" alt="">
            </a>
            <nav class="site-header__nav site-header__nav--desktop" aria-label="주요 메뉴">
                <ul class="site-header__menu">
                    <li class="site-header__item"><a href="#">브랜드</a></li>
                    <li class="site-header__item site-header__item--models">
                        <div class="site-header__dropdown">
                            <a href="#">모델</a>
                        </div>
                    </li>
                    <li class="site-header__item"><a href="#">사전예약</a></li>
                    <li class="site-header__item"><a href="#">ESG</a></li>
                    <li class="site-header__item"><a href="#">고객지원</a></li>
                </ul>
            </nav>
            <a href="#" class="site-header__navi-car site-header__navi-car--desktop" aria-label="차량 네비게이션">
                <img src="assets/images/icon/navi-car.svg" width="28" height="28" alt="" decoding="async">
            </a>
            <button type="button" class="site-header__menu-toggle" aria-expanded="false"
                aria-controls="mobile-drawer" aria-label="메뉴 열기">
                <i class="fa-solid fa-bars site-header__menu-icon site-header__menu-icon--bars" aria-hidden="true"></i>
                <i class="fa-solid fa-xmark site-header__menu-icon site-header__menu-icon--close" aria-hidden="true"></i>
            </button>
        </div>

        <div class="site-header__subnav" id="site-header-subnav-models" aria-hidden="true">
            <div class="inner site-header__subnav-inner">
                <div class="lnb" role="region" aria-label="모델 하위 메뉴">
                    <ul class="lnb__list">
                        <li class="lnb__item"><a class="lnb__link" href="#">ZE-1</a></li>
                        <li class="lnb__item"><a class="lnb__link" href="#">ZE-X</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="mobile-drawer" class="mobile-drawer" aria-hidden="true">
            <div class="mobile-drawer__backdrop" tabindex="-1" aria-hidden="true"></div>
            <div class="mobile-drawer__panel" role="dialog" aria-modal="true" aria-label="모바일 메뉴">
                <nav class="mobile-drawer__nav" aria-label="모바일 주요 메뉴">
                    <ul class="mobile-drawer__list">
                        <li class="mobile-drawer__item"><a class="mobile-drawer__link" href="#">브랜드</a></li>
                        <li class="mobile-drawer__item mobile-drawer__item--accordion">
                            <button type="button" class="mobile-drawer__accordion-btn" aria-expanded="false"
                                aria-controls="mobile-lnb-models" id="mobile-models-trigger">
                                <span>모델</span>
                                <i class="fa-solid fa-chevron-down mobile-drawer__chevron" aria-hidden="true"></i>
                            </button>
                            <ul class="mobile-drawer__lnb" id="mobile-lnb-models" role="list">
                                <li class="mobile-drawer__lnb-item"><a class="mobile-drawer__lnb-link" href="#">ZE-1</a>
                                </li>
                                <li class="mobile-drawer__lnb-item"><a class="mobile-drawer__lnb-link" href="#">ZE-X</a>
                                </li>
                            </ul>
                        </li>
                        <li class="mobile-drawer__item"><a class="mobile-drawer__link" href="#">사전예약</a></li>
                        <li class="mobile-drawer__item"><a class="mobile-drawer__link" href="#">ESG</a></li>
                        <li class="mobile-drawer__item"><a class="mobile-drawer__link" href="#">고객지원</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main id="main-content">
        <section class="kv-hero" aria-labelledby="kv-hero-heading">
            <div class="kv-hero__media" aria-hidden="true">
                <video class="kv-hero__video" autoplay muted loop playsinline>
                    <source src="assets/images/main-kv.mp4" type="video/mp4">
                </video>
            </div>
            <div class="kv-hero__dim" aria-hidden="true"></div>
            <div class="inner kv-hero__inner">
                <div class="kv-hero__copy">
                    <h1 id="kv-hero-heading" class="kv-hero__title">
                        전기차의 새로운 기준,<br>ZEION
                    </h1>
                    <p class="kv-hero__sub">
                        차가운 혁신과 역동적인 주행의 만남. 당신의 일상을 미래로 이끕니다.
                    </p>
                </div>
            </div>
        </section>
        <div class="page-continuation" aria-hidden="true"></div>
    </main>

    <script src="assets/js/libs/gsap.min.js"></script>
    <script src="assets/js/common.js"></script>
</body>

</html>
